<html><head><style>
@font-face{font-family:ZM;src:url(../fonts/ZhiMangXing-Regular.ttf)}
@font-face{font-family:MS;src:url(../fonts/MaShanZheng-Regular.ttf)}
@font-face{font-family:SR;src:url(../fonts/NotoSerifSC.ttf)}
body{margin:0;background:#000}</style></head><body><canvas id=c width=1920 height=1080></canvas>
<script src="common.js"></script><script>
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
let face;
(async()=>{face=await loadImg('../assets/guitu_face.png');await document.fonts.load('300px ZM');await document.fonts.load('80px MS');await document.fonts.load('40px SR');window.ready=true;})();
function off(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
window.draw=function(t){
 const R=mulberry(7);
 // background ink-black with warm undertone
 ctx.fillStyle='#0b0a09';ctx.fillRect(0,0,W,H);
 // ink-wash field (low-res fbm, upscaled)
 {const lw=240,lh=135,lc=off(lw,lh),l=lc.getContext('2d'),im=l.createImageData(lw,lh);
  for(let y=0;y<lh;y++)for(let x=0;x<lw;x++){const u=x/lw,v=y/lh;let n=fbm(u*3.2+t*.01,v*2.4,6);
   const ridge=Math.max(0,1-Math.abs(v-.62-(n-.5)*.35)*5.5);const mist=Math.pow(n,2.2)*.55;
   const k=Math.min(1,ridge*.55+mist*(1-v*.6));const i=(y*lw+x)*4;
   im.data[i]=11+k*48;im.data[i+1]=10+k*42;im.data[i+2]=9+k*36;im.data[i+3]=255;}
  l.putImageData(im,0,0);ctx.imageSmoothingQuality='high';ctx.drawImage(lc,0,0,W,H);}
 // mist
 const mg=ctx.createLinearGradient(0,H*.45,0,H*.8);mg.addColorStop(0,'rgba(233,225,208,0)');mg.addColorStop(.5,'rgba(233,225,208,.05)');mg.addColorStop(1,'rgba(233,225,208,0)');ctx.fillStyle=mg;ctx.fillRect(0,0,W,H);
 // red moon disc behind (subtle)
 ctx.save();const mgx=ctx.createRadialGradient(1320,330,0,1320,330,520);mgx.addColorStop(0,'rgba(179,18,27,.38)');mgx.addColorStop(1,'rgba(179,18,27,0)');ctx.fillStyle=mgx;ctx.fillRect(0,0,W,H);ctx.restore();
 // character with ink-bleed mask
 const fw=1180,fh=face.height*fw/face.width,fx=880,fy=-150;
 const fc=off(fw,fh),f=fc.getContext('2d');f.drawImage(face,0,0,fw,fh);
 // grade: desaturate + warm shadows
 const id=f.getImageData(0,0,fw,fh),d=id.data;
 for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){const i=(y*fw+x)*4;const l=d[i]*.3+d[i+1]*.59+d[i+2]*.11;
  d[i]=l*.62+d[i]*.38+6;d[i+1]=l*.62+d[i+1]*.38-2;d[i+2]=l*.62+d[i+2]*.38-8;
  // ink bleed: left side dissolve with noise
  const n=fbm(x/90,y/90,5),edge=(x/fw)*1.6+ (y/fh)*.25 -.18 + (n-.5)*.9;
  const m=Math.min(1,Math.max(0,(edge-.18)/.12));d[i+3]*=m;}
 f.putImageData(id,0,0);
 // rim light from slash (red) on left edge
 ctx.drawImage(fc,fx,fy);
 // slash line geometry
 const x0=-60,y0=1010,x1=1500,y1=40;
 const ang=Math.atan2(y1-y0,x1-x0);
 // calligraphy 血未冷 split by the slash
 const tc=off(W,H),tx=tc.getContext('2d');
 tx.fillStyle='#e9e1d0';tx.font='300px MS';tx.textBaseline='top';
 const chars=['血','未','冷'];chars.forEach((ch,k)=>{tx.save();tx.translate(250+k*12,70+k*300);tx.rotate((R()-.5)*.08);tx.fillText(ch,0,0);tx.restore();});
 tx.fillStyle='#c41a22';tx.font='150px MS';['刀','不','放'].forEach((ch,k)=>tx.fillText(ch,600,420+k*165));tx.fillStyle='#e9e1d0';
 // dry-brush texture erosion
 tx.globalCompositeOperation='destination-out';for(let k=0;k<1400;k++){const px=200+R()*520,py=60+R()*960,a=-.55+(R()-.5)*.5,L=R()*30+6;tx.strokeStyle=`rgba(0,0,0,${R()*.55})`;tx.lineWidth=R()*1.4+.3;tx.beginPath();tx.moveTo(px,py);tx.lineTo(px+Math.cos(a)*L,py+Math.sin(a)*L);tx.stroke();}
 tx.globalCompositeOperation='source-over';
 // split: side A (below line) stays, side B shifted along slash
 function clipSide(c,above){c.beginPath();const ex=Math.cos(ang)*3000,ey=Math.sin(ang)*3000;c.moveTo(x0-ex,y0-ey);c.lineTo(x0+ex,y0+ey);
  const nx=Math.sin(ang)*3000*(above?1:-1),ny=-Math.cos(ang)*3000*(above?1:-1);c.lineTo(x0+ex+nx,y0+ey+ny);c.lineTo(x0-ex+nx,y0-ey+ny);c.closePath();c.clip();}
 ctx.save();clipSide(ctx,false);ctx.drawImage(tc,0,0);ctx.restore();
 ctx.save();clipSide(ctx,true);ctx.translate(Math.cos(ang)*46+8,Math.sin(ang)*46-10);ctx.drawImage(tc,0,0);ctx.restore();
 // slash: glow layers
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 function blade(w,col,blur){ctx.save();if(blur)ctx.filter=`blur(${blur}px)`;ctx.fillStyle=col;ctx.beginPath();
   const N=60,nx=-Math.sin(ang),ny=Math.cos(ang);const pts=[];
   for(let i=0;i<=N;i++){const u=i/N,bx=x0+(x1-x0)*u,by=y0+(y1-y0)*u,bow=Math.sin(u*Math.PI)*-38;const th=w*Math.pow(Math.sin(u*Math.PI),.7)*(u<.5?u*2:1);pts.push([bx+nx*bow,by+ny*bow,th]);}
   pts.forEach(([x,y,th],i)=>i?ctx.lineTo(x+nx*th,y+ny*th):ctx.moveTo(x+nx*th,y+ny*th));
   for(let i=pts.length-1;i>=0;i--){const [x,y,th]=pts[i];ctx.lineTo(x-nx*th*.35,y-ny*th*.35);}ctx.closePath();ctx.fill();ctx.restore();}
 blade(90,'rgba(150,10,20,.35)',40);blade(36,'rgba(220,40,30,.55)',12);blade(12,'rgba(255,120,80,.85)',3);blade(4,'rgba(255,245,230,1)',0);
 // sparks along slash
 for(let k=0;k<420;k++){const u=R();const px=x0+(x1-x0)*u,py=y0+(y1-y0)*u;const a=ang+(R()<.5?-1:1)*(Math.PI/2)*(.3+R()*.7);const len=R()*R()*180;
  const sx=px+Math.cos(a)*len,sy=py+Math.sin(a)*len;ctx.strokeStyle=`rgba(255,${120+R()*100|0},${60+R()*60|0},${.25+R()*.6})`;ctx.lineWidth=R()*1.8+.3;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*(6+R()*24),sy+Math.sin(a)*(6+R()*24));ctx.stroke();}
 ctx.restore();
 // ink splatter blood drops (vermilion) foreground, blurred
 ctx.save();ctx.filter='blur(6px)';for(let k=0;k<14;k++){ctx.fillStyle=`rgba(150,12,18,${.5+R()*.4})`;ctx.beginPath();ctx.arc(R()*980,H*.6+R()*H*.4,6+R()*26,0,7);ctx.fill();}ctx.restore();
 // floating embers
 ctx.save();ctx.globalCompositeOperation='lighter';for(let k=0;k<160;k++){const px=R()*W,py=R()*H,r=R()*2.2+.4;ctx.fillStyle=`rgba(255,${100+R()*80|0},50,${R()*.7})`;ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();}ctx.restore();
 // seal
 ctx.save();ctx.translate(118,860);ctx.rotate(-.04);ctx.fillStyle='#b3121b';ctx.fillRect(0,0,128,128);ctx.fillStyle='#0b0a09';ctx.font='54px MS';ctx.textBaseline='top';
 ctx.fillText('谁定',8,6);ctx.fillText('正邪',8,64);ctx.globalCompositeOperation='destination-out';for(let k=0;k<300;k++){ctx.fillStyle=`rgba(0,0,0,${R()*.8})`;ctx.fillRect(R()*128,R()*128,R()*4,R()*4);}ctx.restore();
 // small credit-like caption in safe area (lyric line context)
 
 bloom(ctx,W,H,150,.85,10);
 vignette(ctx,W,H,.75);
 grain(ctx,W,H,18,3);
};
</script></body></html>
